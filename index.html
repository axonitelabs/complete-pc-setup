<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Device Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="appShell">

    <div class="setupCard">

      <div class="topRow">
        <div>
          <p class="eyebrow">MAXY.FUN DEVICE SETUP</p>
          <h1 id="stepTitle">Welcome</h1>
        </div>

        <div class="stepCounter" id="stepCounter">
          Step 1
        </div>
      </div>

      <div class="progressTrack">
        <div class="progressFill" id="progressFill"></div>
      </div>

      <div class="contentArea" id="contentArea">
        <!-- JS fills this -->
      </div>

      <div class="navRow">
        <button class="secondaryButton" id="backButton">
          Back
        </button>

        <button class="primaryButton" id="nextButton">
          Continue
        </button>
      </div>

    </div>

  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
